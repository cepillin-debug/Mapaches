  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Contactanos</title>
      <link rel="stylesheet" href="../css/contacto.css">
      <link rel="stylesheet" href="../css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/funciones.js"></script>
  </head> 

  <body>
    <div>
        <div class="separador-general">
          <h1 class="titulo-separador">Inicio de sesion</h1>
        </div>

        <form>
          <div class="contenedor">
            <div class="nosexd">
              <label class="label-s" for="gmail">Gmail:</label>
              <input type="email" id="gmail" name="gmail" required placeholder="ejemplo@gmail.com">
            </div>

            <div class="nosexd"> 
              <label class="label-s" for="contraseña">Contraseña:</label>
              <input type="password" id="contraseña" name="contraseña" required placeholder="Ingrese su contraseña">
            </div>

            <div class="pestaña">
              <button class="boton-enviar" type="submit">Enviar</button>
              <a href="crear-cuenta.html"><button type="button">Crear cuenta</button></a>
            </div>
          </div>
        </form>
      </div>

    </div>

  </body>
  </html>
