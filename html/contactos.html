<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="body-contacto"> 

<form class="row g-3">
<div>
   <h1 class="titulo">
    Datos personales
   </h1> 
    <div class="col-md-6">
    <label for="nombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="nombre" required>
</div>
<div class="col-md-6">
    <label for="apellido" class="form-label">Apellido</label>
    <input type="text" class="form-control" id="apellido" required>
</div>

<div class="col-md-6">
    <label for="correo" class="form-label">ejemplo@gmail.com</label>
    <input type="email" class="form-control" id="correo" required>
</div>
<div class="col-md-6">
    <label for="telefono" class="form-label">+56 9 1234 5678</label>
    <input type="text" class="form-control" id="telefono" required>
</div>

<div class="col-md-6">
    <label for="fecha" class="form-label">Fecha de nacimiento</label>
    <input type="date" class="form-control" id="fecha" required>
</div>
<div class="col-md-4">
    <label for="inputState" class="form-label">Region</label>
    <select id="inputState" class="form-select">
      <option selected>Seleccione una region</option>
      <option>Puerto Montt</option>
      <option>Puerto Varas</option>
      <option>Punta Arenas</option>
    </select>
</div>
</div>





</form>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>  
</body>
</html>
