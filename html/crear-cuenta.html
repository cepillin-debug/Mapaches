<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/inicio-creacion.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Crear Cuenta</title>
</head>
<body>
    <div>
        <div class="separador-general">
        <h1 class="titulo-separador">Crear Cuenta</h1>
        </div>

        <form>
        <div class="contenedor">

            <div class="nosexd">
            <label class="label-s" for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre">
            </div>

            <div class="nosexd">
            <label class="label-s" for="gmail">Gmail:</label>
            <input type="email" id="gmail" name="gmail" required placeholder="ejemplo@gmail.com">
            </div>

            <div class="nosexd"> 
            <label class="label-s" for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" name="contraseña" required placeholder="Ingrese su contraseña">
            </div>

            <div class="pestaña">
            <button class="boton-enviar" type="submit">Guardar</button>
            <a href="inicio-sesion.html"><button class="boton-creacion" type="button">Iniciar sesion</button></a>
            </div>
        </div>
        </form>
    </div>

    </div>

</body>
</html>
